name: Render video draft

on:
  push:
    paths:
      - 'scripts/create_ff06b5_illustrations.py'
      - 'scripts/render_video.py'
      - 'episodes/ep001_ff06b5.json'
      - '.github/workflows/render-video.yml'
  workflow_dispatch:
    inputs:
      episode_path:
        description: "JSON del episodio dentro del repositorio"
        required: true
        default: "episodes/ep001_ff06b5.json"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate renderer and episode JSON
        run: |
          python -m py_compile scripts/render_video.py
          python -m json.tool episodes/ep001_ff06b5.json > /dev/null
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install renderer dependencies
        run: pip install "edge-tts>=7.0.0" "Pillow>=10.0.0"
      - name: Create original FF06B5 illustrations
        run: python scripts/create_ff06b5_illustrations.py
      - name: Render draft
        env:
          EPISODE_PATH: ${{ inputs.episode_path }}
        run: |
          if [ -z "$EPISODE_PATH" ]; then
            EPISODE_PATH="episodes/ep001_ff06b5.json"
          fi
          echo "Rendering episode: $EPISODE_PATH"
          python scripts/render_video.py "$EPISODE_PATH"
      - name: Save MP4 and metadata
        uses: actions/upload-artifact@v4
        with:
          name: video-draft
          path: |
            output/final.mp4
            output/metadata.json
            assets/images/ff06b5/*.png
          if-no-files-found: error
